name: Pre-commit

on:
  workflow_call:
  workflow_dispatch:

jobs:
  pre-commit-simple:
    name: pre-commit simple
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: clang-tidy
