# GitHub Action workflows to build and test the plug-in on Ubuntu
#
# Adapted from  https://github.com/ChargePoint/wireshark-v2g/blob/main/.github/workflows/ubuntu.yml
# Which was adapted from Wireshark's repository https://gitlab.com/wireshark/wireshark/-/tree/master/.github/workflows

name: Build plug-in on Ubuntu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

env:
   WIRESHARK_BRANCH: release-4.4

jobs:
  sytem-build:
    name: Build plugin based on system-installed wireshark
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout plug-in
        uses: actions/checkout@v7

      - name: Install dependencies for a standalone build
        run: |
          sudo add-apt-repository ppa:wireshark-dev/stable -y
          sudo apt-get update -qq
          export DEBIAN_FRONTEND=noninteractive
          echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
          sudo apt-get install -yqq cmake wireshark-dev

      - name: Build plugin standalone
        run: cmake --workflow release

      - name: Upload compiled files
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: install/release/lib/bitcoinv2.so

  repo-build:
    name: Build plugin based on repo-fetched wireshark
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies for the wireshark build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq cmake libglib2.0-dev libc-ares-dev libpcap-dev make libgcrypt-dev flex libxml2-dev

      - name: Checkout plug-in
        uses: actions/checkout@v7

      - name: Cache compiled wireshark
        id: wireshark-cache
        uses: actions/cache@v4
        with:
          path: wireshark/install/
          key: wireshark-${{ runner.os }}-${{ env.WIRESHARK_BRANCH }}-${{ hashFiles('wireshark_build_config/**') }}

      - name: Git clone wireshark
        if: steps.wireshark-cache.outputs.cache-hit != 'true'
        run: |
          mkdir wireshark
          cd wireshark
          git init
          git remote add -t "${{ env.WIRESHARK_BRANCH }}" -f origin https://gitlab.com/wireshark/wireshark.git
          git checkout ${{ env.WIRESHARK_BRANCH }}

      - name: Copy custom wireshark build files
        if: steps.wireshark-cache.outputs.cache-hit != 'true'
        run: |
          cp wireshark_build_config/CMakeUserPresets.json wireshark

      - name: Build wireshark
        if: steps.wireshark-cache.outputs.cache-hit != 'true'
        run: |
          cd wireshark
          cmake --preset build-for-plugin
          cmake --build build
          cmake --install build --prefix ./install/
          # Installs the wireshark cmake package as well
          cmake --install build --prefix ./install --component Development

      - name: Build plugin depending on repo wireshark
        run: WIRESHARK_CMAKE_DIR=./wireshark/install/lib/cmake/wireshark/ cmake --workflow release

      - name: Upload compiled files
        uses: actions/upload-artifact@v7
        with:
          name: binaries/wireshark-${{ env.WIRESHARK_BRANCH }}
          path: install/release/lib/bitcoinv2.so

