# GitHub Action workflows to build and test the plug-in on Windows
#
# Adapted from Wireshark's repository https://gitlab.com/wireshark/wireshark/-/tree/master/.github/workflows

name: Build plug-in on Windows

on:
  workflow_call:
  workflow_dispatch:

env:
  # Where to download third-party libraries (https://www.wireshark.org/docs/wsdg_html_chunked/ChSetupWindows.html)
  WIRESHARK_BASE_DIR: C:/wireshark-libs

jobs:
  repo-build:
    name: Build plugin based on repo-fetched wireshark
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: true
      matrix:
        runner: [windows-latest, windows-11-arm]
        wireshark-branch:
          - release-4.2

    env:
      WIRESHARK_BRANCH: ${{ matrix.wireshark-branch }}

    steps:
      - name: Install CMake
        shell: bash
        run: |
          choco install -y --force --no-progress cmake

      - name: Install winflexbison3
        shell: bash
        run: choco install -y --force --no-progress winflexbison3

      - name: Checkout plug-in
        uses: actions/checkout@v7

      - name: Cache compiled wireshark
        id: wireshark-cache
        uses: actions/cache@v6
        with:
          path: |
            wireshark/install-dir/
            # The third-party libraries are downloaded only when wireshakr is built
            ${{ env.WIRESHARK_BASE_DIR }}
          key: wireshark-${{ runner.os }}-${{ runner.arch }}-${{ env.WIRESHARK_BRANCH }}-${{ hashFiles('wireshark_build_config/**') }}-test2

      - name: Checkout Wireshark
        if: steps.wireshark-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir wireshark
          cd wireshark
          git init
          git remote add -t "${{ env.WIRESHARK_BRANCH }}" -f origin https://gitlab.com/wireshark/wireshark.git
          git checkout ${{ env.WIRESHARK_BRANCH }}

      - name: Copy custom wireshark build files
        if: steps.wireshark-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cp wireshark_build_config/CMakeUserPresets.json wireshark

      - name: Set MSVC command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build wireshark
        if: steps.wireshark-cache.outputs.cache-hit != 'true'
        # Don't change to bash
        shell: pwsh
        run: |
          cd wireshark
          cmake --preset build-for-plugin
          cmake --build build
          cmake --install build --prefix ./install-dir/
          # Installs the wireshark cmake package as well
          cmake --install build --prefix ./install-dir --component Development

      - name: Build plugin depending on repo wireshark
        shell: pwsh
        env:
          WIRESHARK_CMAKE_PACKAGE_SEARCH_PATH: ./wireshark/install-dir
        run: cmake --workflow release

      - name: Upload compiled file
        uses: actions/upload-artifact@v7
        with:
           name: binary-windows-${{ runner.arch }}-wireshark-${{ env.WIRESHARK_BRANCH }}
           path: install/release/lib/bitcoinv2.dll
