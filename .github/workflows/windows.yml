# GitHub Action workflows to build and test the plug-in on Windows
#
# Adapted from Wireshark's repository https://gitlab.com/wireshark/wireshark/-/tree/master/.github/workflows

name: Build plug-in on Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

env:
   WIRESHARK_BRANCH: release-4.4
   WIRESHARK_BASE_DIR: C:/wireshark-libs

jobs:
  repo-build:
    name: Build plugin based on repo-fetched wireshark
    runs-on: windows-latest
    steps:
      - name: Install dependencies for the wireshark build
        shell: bash
        run: |
          choco install -y --force --no-progress cmake
          vcpkg install glib:x64-windows

      - name: Install winflexbison3
        shell: bash
        run: choco install -y --force --no-progress winflexbison3 --version 2.5.18.20190508

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2
        with:
           vs-version: 16.4

      - name: Checkout plug-in
        uses: actions/checkout@v7

      - name: Checkout Wireshark
        shell: bash
        run: |
          mkdir wireshark
          cd wireshark
          git init
          git remote add -t "${{ env.WIRESHARK_BRANCH }}" -f origin https://gitlab.com/wireshark/wireshark.git
          git checkout ${{ env.WIRESHARK_BRANCH }}

      - name: Copy custom wireshark build files
        shell: bash
        run: |
          cp wireshark_build_config/CMakeUserPresets.json wireshark

      - name: Set MSVC command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Mkdir
        shell: bash
        run: mkdir build

      - name: Build wireshark
        shell: bash
        run: |
          cd wireshark
          cmake --preset build-for-plugin
          cmake --build build
          cmake --install build --prefix ./install/
          # Installs the wireshark cmake package as well
          cmake --install build --prefix ./install --component Development

      - name: Build plugin depending on repo wireshark
        shell: bash
        run: WIRESHARK_CMAKE_DIR=./wireshark/install/lib/cmake/wireshark/ cmake --workflow release

      - name: ls install
        shell: bash
        run: ls install

      - name: Move plugin dll
        shell: bash
        run: |
           mv build/run/RelWithDebInfo/plugins/3.6/epan/sap.dll exe/sap.dll

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
           name: packages
           path: exe
